name: Publish image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: image-publishing
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      ECR_REPOSITORY: integration-catalogue
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve and log in to Amazon ECR
        id: ecr
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$account_id"
          registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      - name: Check for existing immutable image
        id: image
        run: |
          IMAGE_COUNT=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'length(images)' \
            --output text)
          if [ "$IMAGE_COUNT" = "1" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.image.outputs.exists != 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: docker build --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Push immutable image
        if: steps.image.outputs.exists != 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Write deployment summary
        run: |
          echo "### Container image published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: \`$ECR_REPOSITORY\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Already existed: \`${{ steps.image.outputs.exists }}\`" >> "$GITHUB_STEP_SUMMARY"
