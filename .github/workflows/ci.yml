name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[ai,ui,dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build application container
        run: docker build --tag integration-catalogue:ci .

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.0"
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize and validate bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Initialize and validate platform
        working-directory: infra/platform
        run: |
          terraform init -backend=false -input=false
          terraform validate
