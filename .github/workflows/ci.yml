name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[ai,ui,dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build application container
        run: docker build --tag integration-catalogue:ci .
      - name: Scan application container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: integration-catalogue:ci
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize and validate bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Initialize and validate platform
        working-directory: infra/platform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Initialize and validate DEV runtime
        working-directory: infra/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Initialize and validate persistent DEV edge
        working-directory: infra/environments/dev-edge
        run: |
          terraform init -backend=false -input=false
          terraform validate
