name: Test Solace connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-test-event:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate configuration
        env:
          SOLACE_WSS_URL: ${{ secrets.SOLACE_WSS_URL }}
          SOLACE_USERNAME: ${{ secrets.SOLACE_USERNAME }}
          SOLACE_PASSWORD: ${{ secrets.SOLACE_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in SOLACE_WSS_URL SOLACE_USERNAME SOLACE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required secret $name is not configured"
              missing=1
            fi
          done
          if [[ -n "$SOLACE_WSS_URL" && "$SOLACE_WSS_URL" != wss://* ]]; then
            echo "::error::SOLACE_WSS_URL must start with wss://"
            missing=1
          fi
          exit "$missing"

      - name: Install MQTT client
        run: npm install --no-save --ignore-scripts mqtt@5.14.1

      - name: Publish test event over WSS
        env:
          SOLACE_WSS_URL: ${{ secrets.SOLACE_WSS_URL }}
          SOLACE_USERNAME: ${{ secrets.SOLACE_USERNAME }}
          SOLACE_PASSWORD: ${{ secrets.SOLACE_PASSWORD }}
        run: node .github/scripts/solace-wss-publish.cjs
